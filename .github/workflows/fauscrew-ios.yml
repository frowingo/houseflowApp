name: FausCrew iOS

on:
  pull_request:
    paths:
      - 'FausCrew/**'
      - '!FausCrew/android/**'
      - 'FausCrewTests/**'
      - 'FausCrew.xcodeproj/**'
      - 'FausCrew.entitlements'
      - 'FausCrew*Info.plist'
      - '.github/workflows/fauscrew-ios.yml'
  workflow_dispatch:

concurrency:
  group: fauscrew-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project FausCrew.xcodeproj -scheme FausCrew
      - name: Build and test
        run: |
          # Any available iPhone simulator, so the job does not depend on a device name on the image.
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for device in devices:
                  if "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')
          xcodebuild test \
            -project FausCrew.xcodeproj \
            -scheme FausCrew \
            -destination "platform=iOS Simulator,id=${udid}" \
            CODE_SIGNING_ALLOWED=NO
