name: HouseFlow Android bridge

on:
  pull_request:
    paths:
      - 'HouseFlow/android/**'
      - 'HouseFlow/shared/**'
      - '.github/workflows/houseflow-android-bridge.yml'
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: HouseFlow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.4.0'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370'
      - name: Install pinned Swift Android SDK
        run: |
          swift sdk install https://download.swift.org/swift-6.4.0-release/android-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_android.artifactbundle.tar.gz \
            --checksum 21fb555122a3d801ad943d48df7ebffdd8824de61c25c180bb792d3edaee0b43
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          for sdk_dir in "$HOME/.config/swiftpm/swift-sdks" "$HOME/.swiftpm/swift-sdks"; do
            if [ -d "$sdk_dir/swift-6.4.0-RELEASE_android.artifactbundle" ]; then
              echo "SWIFT_ANDROID_SDK_BUNDLE=$sdk_dir/swift-6.4.0-RELEASE_android.artifactbundle" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Installed Swift Android SDK artifactbundle not found' >&2
          exit 1
      - name: Link Swift Android SDK to pinned NDK
        run: |
          SWIFT_ANDROID_NDK_LINK=1 bash "$SWIFT_ANDROID_SDK_BUNDLE/swift-android/scripts/setup-android-sdk.sh"
      - name: Verify pinned tools
        run: |
          sh android/scripts/check-android-toolchain.sh
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Resolve and test Swift bridge
        run: |
          git ls-files --error-unmatch android/swift-bridge/Package.resolved
          swift package resolve --package-path android/swift-bridge
          git diff --exit-code -- android/swift-bridge/Package.resolved
          swift test --package-path shared
          swift test --package-path android/swift-bridge
          sh android/scripts/check-android-bindings.sh
      - name: Publish pinned SwiftKitCore to Maven Local
        run: |
          android/swift-bridge/.build/checkouts/swift-java/gradlew \
            --project-dir android/swift-bridge/.build/checkouts/swift-java \
            :SwiftKitCore:publishToMavenLocal -PswiftkitVersion=0.6.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android debug and release
        working-directory: HouseFlow/android
        run: |
          ./gradlew :swift-bridge:assembleDebug :swift-bridge:assembleRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest --no-daemon
      - name: Check generated API and native package contents
        run: |
          sh android/scripts/check-android-bindings.sh
          sh android/scripts/check-android-package.sh android/swift-bridge/build/outputs/aar/swift-bridge-debug.aar
          sh android/scripts/check-android-package.sh android/swift-bridge/build/outputs/aar/swift-bridge-release.aar
          sh android/scripts/check-android-package.sh android/app/build/outputs/apk/debug/app-debug.apk
          sh android/scripts/check-android-package.sh android/app/build/outputs/apk/release/app-release-unsigned.apk
          sh android/scripts/check-android-package.sh android/app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/release/app-release-unsigned.apk
      # The local Apple Silicon AVD covers API 36/arm64. Run this on demand to
      # prove the declared minSdk and x86_64 runtime without a second local image.
      - name: Enable KVM for API 31 smoke
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 31 x86_64 instrumentation smoke
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            cd HouseFlow/android
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
