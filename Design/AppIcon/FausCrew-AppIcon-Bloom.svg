<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E97A8"/>
      <stop offset="0.45" stop-color="#336063"/>
      <stop offset="1" stop-color="#6A122F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky" cx="1" cy="0" r="0.7">
      <stop offset="0" stop-color="#88BAC8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#88BAC8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1B2236" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- Petal flower and its outline in place of Faus Light's corner circle. -->
  <g transform="translate(900 116)">
    <g fill="#FFFFFF" opacity="0.08">
      <ellipse cx="0" cy="-128" rx="80" ry="128"/>
      <ellipse cx="0" cy="-128" rx="80" ry="128" transform="rotate(72)"/>
      <ellipse cx="0" cy="-128" rx="80" ry="128" transform="rotate(144)"/>
      <ellipse cx="0" cy="-128" rx="80" ry="128" transform="rotate(216)"/>
      <ellipse cx="0" cy="-128" rx="80" ry="128" transform="rotate(288)"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5">
      <ellipse cx="0" cy="-88" rx="50" ry="88" transform="rotate(36)"/>
      <ellipse cx="0" cy="-88" rx="50" ry="88" transform="rotate(108)"/>
      <ellipse cx="0" cy="-88" rx="50" ry="88" transform="rotate(180)"/>
      <ellipse cx="0" cy="-88" rx="50" ry="88" transform="rotate(252)"/>
      <ellipse cx="0" cy="-88" rx="50" ry="88" transform="rotate(324)"/>
    </g>
  </g>
  <!-- A long leaf rising toward the bottom-end edge. -->
  <path d="M520 1000 C640 930 790 900 1040 800 C860 940 680 990 520 1000 Z" fill="#FFFFFF" fill-opacity="0.08"/>
  <!-- Blush sprig at the top-start corner, as on the Bloom hero card. -->
  <g transform="translate(-14 -14) scale(3.1)">
    <path d="M2 64 C30 40 60 26 112 10" fill="none" stroke="#F2D6DE" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M34 42 C36 30 46 24 56 26 C52 36 44 42 34 42 Z M66 26 C72 16 84 12 94 16 C86 24 76 28 66 26 Z" fill="#F2D6DE" fill-opacity="0.5"/>
  </g>
  <g filter="url(#shadow)">
    <g fill="none" stroke="#FFFFFF" stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
      <path d="M692 398 L512 246 L332 398 V778"/>
      <path d="M332 578 H512"/>
    </g>
    <circle cx="622" cy="578" r="44" fill="#FFFFFF"/>
  </g>
  <!-- A blush blossom at the foot of the mark. -->
  <g transform="translate(800 812)">
    <g fill="#F2D6DE" opacity="0.92">
      <ellipse cx="0" cy="-46" rx="28" ry="46"/>
      <ellipse cx="0" cy="-46" rx="28" ry="46" transform="rotate(72)"/>
      <ellipse cx="0" cy="-46" rx="28" ry="46" transform="rotate(144)"/>
      <ellipse cx="0" cy="-46" rx="28" ry="46" transform="rotate(216)"/>
      <ellipse cx="0" cy="-46" rx="28" ry="46" transform="rotate(288)"/>
    </g>
    <circle r="18" fill="#D9A441"/>
  </g>
</svg>
